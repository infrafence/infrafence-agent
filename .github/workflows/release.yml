name: Release

on:
  push:
    tags:
      - "v*"

permissions: read-all

jobs:
  build:
    name: Build & Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.27"
          cache-dependency-path: go.sum

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build binaries
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          mkdir -p build

          # Bare metal binaries (no client-go, ~7MB)
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build \
            -ldflags "-s -w -X main.version=${VERSION}" \
            -o build/infrafence-agent-linux-amd64 \
            ./cmd/infrafence-agent

          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build \
            -ldflags "-s -w -X main.version=${VERSION}" \
            -o build/infrafence-agent-linux-arm64 \
            ./cmd/infrafence-agent

          # K8s binaries (includes client-go, ~33MB)
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build \
            -tags kubernetes \
            -ldflags "-s -w -X main.version=${VERSION}" \
            -o build/infrafence-agent-linux-amd64-k8s \
            ./cmd/infrafence-agent

          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build \
            -tags kubernetes \
            -ldflags "-s -w -X main.version=${VERSION}" \
            -o build/infrafence-agent-linux-arm64-k8s \
            ./cmd/infrafence-agent

          # Built-in WAF rules, read by the dashboard's WAF page
          go run ./cmd/wafcatalog -version "${VERSION}" > build/waf-catalog.json

          # The free server audit script (infrafence.com/audit.sh redirects
          # to this release asset)
          cp audit.sh build/audit.sh

      - name: Generate checksums
        working-directory: build
        run: |
          sha256sum infrafence-agent-linux-amd64 > infrafence-agent-linux-amd64.sha256
          sha256sum infrafence-agent-linux-arm64 > infrafence-agent-linux-arm64.sha256
          sha256sum infrafence-agent-linux-amd64-k8s > infrafence-agent-linux-amd64-k8s.sha256
          sha256sum infrafence-agent-linux-arm64-k8s > infrafence-agent-linux-arm64-k8s.sha256
          sha256sum audit.sh > audit.sh.sha256
          cat *.sha256 > checksums.txt

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign release artifacts
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        working-directory: build
        run: |
          cosign sign-blob --key env://COSIGN_PRIVATE_KEY --yes \
            --output-signature infrafence-agent-linux-amd64.sig \
            infrafence-agent-linux-amd64
          cosign sign-blob --key env://COSIGN_PRIVATE_KEY --yes \
            --output-signature infrafence-agent-linux-arm64.sig \
            infrafence-agent-linux-arm64
          cosign sign-blob --key env://COSIGN_PRIVATE_KEY --yes \
            --output-signature infrafence-agent-linux-amd64-k8s.sig \
            infrafence-agent-linux-amd64-k8s
          cosign sign-blob --key env://COSIGN_PRIVATE_KEY --yes \
            --output-signature infrafence-agent-linux-arm64-k8s.sig \
            infrafence-agent-linux-arm64-k8s
          cosign sign-blob --key env://COSIGN_PRIVATE_KEY --yes \
            --output-signature audit.sh.sig \
            audit.sh
          cosign sign-blob --key env://COSIGN_PRIVATE_KEY --yes \
            --output-signature checksums.txt.sig \
            checksums.txt

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            build/infrafence-agent-linux-amd64
            build/infrafence-agent-linux-arm64
            build/infrafence-agent-linux-amd64-k8s
            build/infrafence-agent-linux-arm64-k8s
            build/audit.sh

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          name: ${{ steps.version.outputs.VERSION }}
          fail_on_unmatched_files: true
          make_latest: true
          body: |
            ## InfraFence Agent ${{ steps.version.outputs.VERSION }}

            ### Install
            ```bash
            curl -fsSL https://infrafence.com/install.sh | sudo bash -s -- --token <YOUR_TOKEN>
            ```

            ### Free server audit (read-only, installs nothing)
            ```bash
            curl -fsSL https://infrafence.com/audit.sh | sh
            ```

            ### Docker
            ```bash
            docker run -d --privileged --net=host --pid=host \
              -v /var/log:/var/log:ro \
              -v /var/run/docker.sock:/var/run/docker.sock:ro \
              -e INFRAFENCE_TOKEN=<YOUR_TOKEN> \
              ghcr.io/infrafence/infrafence-agent:${{ steps.version.outputs.VERSION }}
            ```

            ### Manual download
            | Platform | Binary |
            |---|---|
            | Linux x86_64 | `infrafence-agent-linux-amd64` |
            | Linux ARM64  | `infrafence-agent-linux-arm64` |
            | Linux x86_64 (K8s) | `infrafence-agent-linux-amd64-k8s` |
            | Linux ARM64 (K8s)  | `infrafence-agent-linux-arm64-k8s` |

          files: |
            build/infrafence-agent-linux-amd64
            build/infrafence-agent-linux-amd64.sha256
            build/infrafence-agent-linux-amd64.sig
            build/infrafence-agent-linux-arm64
            build/infrafence-agent-linux-arm64.sha256
            build/infrafence-agent-linux-arm64.sig
            build/infrafence-agent-linux-amd64-k8s
            build/infrafence-agent-linux-amd64-k8s.sha256
            build/infrafence-agent-linux-amd64-k8s.sig
            build/infrafence-agent-linux-arm64-k8s
            build/infrafence-agent-linux-arm64-k8s.sha256
            build/infrafence-agent-linux-arm64-k8s.sig
            build/checksums.txt
            build/checksums.txt.sig
            build/waf-catalog.json
            install.sh
            build/audit.sh
            build/audit.sh.sha256
            build/audit.sh.sig

  docker:
    name: Docker Image
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Set up QEMU (multi-arch)
        uses: docker/setup-qemu-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: infrafence
          password: ${{ secrets.DOCKERHUB_TOKEN }}
        continue-on-error: true

      - name: Build and push
        id: docker-build
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: |
            VERSION=${{ steps.version.outputs.VERSION }}
            BUILD_TAGS=kubernetes
          tags: |
            ghcr.io/infrafence/infrafence-agent:latest
            ghcr.io/infrafence/infrafence-agent:${{ steps.version.outputs.VERSION }}
            infrafence/infrafence-agent:latest
            infrafence/infrafence-agent:${{ steps.version.outputs.VERSION }}
          labels: |
            org.opencontainers.image.title=InfraFence Agent
            org.opencontainers.image.description=Real-time attack detection and blocking for Linux servers
            org.opencontainers.image.vendor=InfraFence
            org.opencontainers.image.source=https://github.com/infrafence/infrafence-agent
            org.opencontainers.image.version=${{ steps.version.outputs.VERSION }}

      - name: Attest Docker image provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ghcr.io/infrafence/infrafence-agent
          subject-digest: ${{ steps.docker-build.outputs.digest }}
          push-to-registry: true

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign Docker image
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          cosign sign --key env://COSIGN_PRIVATE_KEY \
            --yes \
            ghcr.io/infrafence/infrafence-agent@${{ steps.docker-build.outputs.digest }}

  helm:
    name: Helm Chart
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Update Chart version and appVersion
        run: |
          # `version` was never bumped here before — every release re-pushed the
          # same OCI tag (chart version is the OCI tag for Helm charts) with
          # different content underneath, which is exactly what a chart
          # repository's version-immutability assumption forbids. Artifact
          # Hub's tracker saw "already indexed this version" every time and
          # never picked up anything new (confirmed: last_tracking_ts stuck
          # days behind while last_scanning_ts kept advancing normally).
          # Chart version now simply tracks the agent's own version.
          sed -i "s/^version:.*/version: ${{ steps.version.outputs.VERSION }}/" charts/infrafence-agent/Chart.yaml
          sed -i "s/^appVersion:.*/appVersion: \"${{ steps.version.outputs.VERSION }}\"/" charts/infrafence-agent/Chart.yaml

      - name: Login to GHCR (Helm)
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Login to GHCR (Docker/Cosign)
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Import GPG key
        run: |
          echo "${{ secrets.GPG_PRIVATE_KEY }}" | gpg --batch --import
          gpg --export-secret-keys > /tmp/secring.gpg

      - name: Package chart (signed)
        run: |
          helm package charts/infrafence-agent \
            --sign --key "InfraFence" --keyring /tmp/secring.gpg \
            -d /tmp/charts

      - name: Push chart with provenance to GHCR
        run: |
          CHART_VERSION=$(grep '^version:' charts/infrafence-agent/Chart.yaml | awk '{print $2}')
          CHART_TGZ="/tmp/charts/infrafence-agent-${CHART_VERSION}.tgz"

          # helm push already detects and attaches the co-located .tgz.prov
          # file (produced by `helm package --sign` above) as a layer on its
          # own — do not also upload it separately and append it to the
          # manifest by hand, that produces a manifest with the provenance
          # layer listed twice (verified: this is what was happening).
          helm push "${CHART_TGZ}" oci://ghcr.io/infrafence/charts

  # ---- Edge packages: OpenWrt / GL.iNet routers and OPNsense ----------------
  # Off until the edge launch: none of these jobs runs (and a release is
  # exactly as before) until the repository variable EDGE_PUBLISH is set to
  # "true". Plain X.Y.Z tags only. They sign with the keys in the "release"
  # environment and publish to https://pkg.infrafence.com over SSH, one
  # tarball per product, through the server's forced command
  # (deploy/pkg-publish.sh). Secrets, variables and server setup:
  # deploy/README.md.
  edge-openwrt:
    name: OpenWrt feed
    if: vars.EDGE_PUBLISH == 'true' && !contains(github.ref_name, '-')
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: release
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27"
          cache-dependency-path: go.sum
      - name: Version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - name: Binaries
        run: packaging/openwrt/build-binaries.sh build/bin "$VERSION"
      - name: Packages and signed feeds
        env:
          OPENWRT_USIGN_KEY: ${{ secrets.OPENWRT_USIGN_KEY }}
          OPENWRT_APK_KEY: ${{ secrets.OPENWRT_APK_KEY }}
        run: |
          set -euo pipefail
          for f in packaging/openwrt/keys/usign.pub packaging/openwrt/keys/apk.pem; do
            [ -s "$f" ] || { echo "::error::$f is not committed (deploy/pkg-keygen.sh)"; exit 1; }
          done
          [ -n "$OPENWRT_USIGN_KEY" ] && [ -n "$OPENWRT_APK_KEY" ] || { echo "::error::OPENWRT_USIGN_KEY / OPENWRT_APK_KEY missing"; exit 1; }
          keys=$(mktemp -d)
          trap 'rm -rf "$keys"' EXIT
          (umask 077
           printf '%s\n' "$OPENWRT_USIGN_KEY" > "$keys/usign.sec"
           printf '%s\n' "$OPENWRT_APK_KEY" > "$keys/apk.sec")
          # The secret keys must be the halves of the committed public keys
          # (which the installers pin): a mismatch would publish a feed no
          # router accepts.
          echo probe > "$keys/probe"
          go run ./packaging/openwrt/owrtpkg sign -sec "$keys/usign.sec" -m "$keys/probe"
          go run ./packaging/openwrt/owrtpkg verify -pub packaging/openwrt/keys/usign.pub -m "$keys/probe" >/dev/null \
            || { echo "::error::OPENWRT_USIGN_KEY does not match packaging/openwrt/keys/usign.pub"; exit 1; }
          openssl ec -in "$keys/apk.sec" -pubout 2>/dev/null | cmp -s - packaging/openwrt/keys/apk.pem \
            || { echo "::error::OPENWRT_APK_KEY does not match packaging/openwrt/keys/apk.pem"; exit 1; }
          USIGN_SEC="$keys/usign.sec" USIGN_PUB=packaging/openwrt/keys/usign.pub \
          APK_SEC="$keys/apk.sec" APK_PUB=packaging/openwrt/keys/apk.pem \
            packaging/openwrt/build-packages.sh build/bin "$VERSION" build/pkgroot/openwrt
      - name: Publish to pkg.infrafence.com
        env:
          PKG_DEPLOY_HOST: ${{ vars.PKG_DEPLOY_HOST }}
          PKG_DEPLOY_USER: ${{ vars.PKG_DEPLOY_USER }}
          PKG_DEPLOY_KNOWN_HOSTS: ${{ vars.PKG_DEPLOY_KNOWN_HOSTS }}
          PKG_DEPLOY_SSH_KEY: ${{ secrets.PKG_DEPLOY_SSH_KEY }}
        run: deploy/pkg-upload.sh openwrt "$VERSION" build/pkgroot

  edge-opnsense:
    name: OPNsense repository
    if: vars.EDGE_PUBLISH == 'true' && !contains(github.ref_name, '-')
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    environment: release
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Version and prerequisites
        run: |
          echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          for f in packaging/opnsense/build-pkgs.sh packaging/opnsense/make-repo.sh packaging/opnsense/infrafence-repo.pub; do
            [ -s "$f" ] || { echo "::error::$f is not on this commit (OPNsense packaging, deploy/pkg-keygen.sh)"; exit 1; }
          done
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27"
          cache-dependency-path: go.sum
      - name: FreeBSD binaries
        run: |
          mkdir -p dist
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=freebsd GOARCH=$arch go build -trimpath -ldflags "-s -w -X main.version=${VERSION}" \
              -o dist/infrafence-agent-freebsd-$arch ./cmd/infrafence-agent
          done
      - name: Repository key
        env:
          OPNSENSE_REPO_KEY: ${{ secrets.OPNSENSE_REPO_KEY }}
        run: |
          set -euo pipefail
          [ -n "$OPNSENSE_REPO_KEY" ] || { echo "::error::OPNSENSE_REPO_KEY missing"; exit 1; }
          # Inside the workspace so the FreeBSD VM sees it; removed in the VM
          # before the copy back and again in the cleanup step below.
          (umask 077; mkdir -p .repo-key; printf '%s\n' "$OPNSENSE_REPO_KEY" > .repo-key/key.pem)
          openssl rsa -in .repo-key/key.pem -pubout 2>/dev/null | cmp -s - packaging/opnsense/infrafence-repo.pub \
            || { echo "::error::OPNSENSE_REPO_KEY does not match packaging/opnsense/infrafence-repo.pub"; exit 1; }
      - name: Packages and signed repository (FreeBSD VM)
        uses: vmactions/freebsd-vm@c46abacb49f09938ca4e1702d15d836285d694cc # v1.5.9
        with:
          release: "14.3"
          usesh: true
          envs: "VERSION"
          run: |
            set -e
            trap 'rm -rf .repo-key' EXIT
            chmod +x dist/infrafence-agent-freebsd-*
            sh packaging/opnsense/build-pkgs.sh -b dist/infrafence-agent-freebsd-amd64 -v "$VERSION" -a amd64 -o dist/pkgs-amd64
            sh packaging/opnsense/build-pkgs.sh -b dist/infrafence-agent-freebsd-arm64 -v "$VERSION" -a aarch64 -o dist/pkgs-aarch64
            sh packaging/opnsense/make-repo.sh -k .repo-key/key.pem -r dist/repo/opnsense -a amd64 dist/pkgs-amd64/*.pkg
            sh packaging/opnsense/make-repo.sh -k .repo-key/key.pem -r dist/repo/opnsense -a aarch64 dist/pkgs-aarch64/*.pkg
      - name: Remove the repository key
        if: always()
        run: rm -rf .repo-key
      - name: Publish to pkg.infrafence.com
        env:
          PKG_DEPLOY_HOST: ${{ vars.PKG_DEPLOY_HOST }}
          PKG_DEPLOY_USER: ${{ vars.PKG_DEPLOY_USER }}
          PKG_DEPLOY_KNOWN_HOSTS: ${{ vars.PKG_DEPLOY_KNOWN_HOSTS }}
          PKG_DEPLOY_SSH_KEY: ${{ secrets.PKG_DEPLOY_SSH_KEY }}
        run: deploy/pkg-upload.sh opnsense "$VERSION" dist/repo

  edge-site:
    name: pkg.infrafence.com index, keys and installers
    if: vars.EDGE_PUBLISH == 'true' && !contains(github.ref_name, '-')
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: release
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build and publish
        env:
          PKG_DEPLOY_HOST: ${{ vars.PKG_DEPLOY_HOST }}
          PKG_DEPLOY_USER: ${{ vars.PKG_DEPLOY_USER }}
          PKG_DEPLOY_KNOWN_HOSTS: ${{ vars.PKG_DEPLOY_KNOWN_HOSTS }}
          PKG_DEPLOY_SSH_KEY: ${{ secrets.PKG_DEPLOY_SSH_KEY }}
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          deploy/pkg-site.sh build/pkgroot "$VERSION"
          deploy/pkg-upload.sh site "$VERSION" build/pkgroot

  edge-assets:
    name: Edge installers on the release
    if: vars.EDGE_PUBLISH == 'true' && !contains(github.ref_name, '-')
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Cosign
        uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1
      - name: Sign and attach the installers
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p build/edge
          cp packaging/openwrt/router-install.sh build/edge/
          if [ -f packaging/opnsense/opnsense-install.sh ]; then cp packaging/opnsense/opnsense-install.sh build/edge/; fi
          cd build/edge
          for f in *.sh; do
            sha256sum "$f" > "$f.sha256"
            cosign sign-blob --key env://COSIGN_PRIVATE_KEY --yes --output-signature "$f.sig" "$f"
          done
          gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber ./*.sh ./*.sh.sha256 ./*.sh.sig
