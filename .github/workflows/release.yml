name: Release

on:
  push:
    tags:
      - "v*"

permissions: read-all

jobs:
  build:
    name: Build & Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache-dependency-path: go.sum

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build binaries
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          mkdir -p build

          # Bare metal binaries (no client-go, ~7MB)
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build \
            -ldflags "-s -w -X main.version=${VERSION}" \
            -o build/infrafence-agent-linux-amd64 \
            ./cmd/infrafence-agent

          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build \
            -ldflags "-s -w -X main.version=${VERSION}" \
            -o build/infrafence-agent-linux-arm64 \
            ./cmd/infrafence-agent

          # K8s binaries (includes client-go, ~33MB)
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build \
            -tags kubernetes \
            -ldflags "-s -w -X main.version=${VERSION}" \
            -o build/infrafence-agent-linux-amd64-k8s \
            ./cmd/infrafence-agent

          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build \
            -tags kubernetes \
            -ldflags "-s -w -X main.version=${VERSION}" \
            -o build/infrafence-agent-linux-arm64-k8s \
            ./cmd/infrafence-agent

      - name: Generate checksums
        working-directory: build
        run: |
          sha256sum infrafence-agent-linux-amd64 > infrafence-agent-linux-amd64.sha256
          sha256sum infrafence-agent-linux-arm64 > infrafence-agent-linux-arm64.sha256
          sha256sum infrafence-agent-linux-amd64-k8s > infrafence-agent-linux-amd64-k8s.sha256
          sha256sum infrafence-agent-linux-arm64-k8s > infrafence-agent-linux-arm64-k8s.sha256
          cat *.sha256 > checksums.txt

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign release artifacts
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        working-directory: build
        run: |
          cosign sign-blob --key env://COSIGN_PRIVATE_KEY --yes \
            --output-signature infrafence-agent-linux-amd64.sig \
            infrafence-agent-linux-amd64
          cosign sign-blob --key env://COSIGN_PRIVATE_KEY --yes \
            --output-signature infrafence-agent-linux-arm64.sig \
            infrafence-agent-linux-arm64
          cosign sign-blob --key env://COSIGN_PRIVATE_KEY --yes \
            --output-signature infrafence-agent-linux-amd64-k8s.sig \
            infrafence-agent-linux-amd64-k8s
          cosign sign-blob --key env://COSIGN_PRIVATE_KEY --yes \
            --output-signature infrafence-agent-linux-arm64-k8s.sig \
            infrafence-agent-linux-arm64-k8s
          cosign sign-blob --key env://COSIGN_PRIVATE_KEY --yes \
            --output-signature checksums.txt.sig \
            checksums.txt

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            build/infrafence-agent-linux-amd64
            build/infrafence-agent-linux-arm64
            build/infrafence-agent-linux-amd64-k8s
            build/infrafence-agent-linux-arm64-k8s

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          name: ${{ steps.version.outputs.VERSION }}
          fail_on_unmatched_files: true
          make_latest: true
          body: |
            ## InfraFence Agent ${{ steps.version.outputs.VERSION }}

            ### Install
            ```bash
            curl -fsSL https://infrafence.com/install.sh | sudo bash -s -- --token <YOUR_TOKEN>
            ```

            ### Docker
            ```bash
            docker run -d --privileged --net=host --pid=host \
              -v /var/log:/var/log:ro \
              -v /var/run/docker.sock:/var/run/docker.sock:ro \
              -e INFRAFENCE_TOKEN=<YOUR_TOKEN> \
              ghcr.io/infrafence/infrafence-agent:${{ steps.version.outputs.VERSION }}
            ```

            ### Manual download
            | Platform | Binary |
            |---|---|
            | Linux x86_64 | `infrafence-agent-linux-amd64` |
            | Linux ARM64  | `infrafence-agent-linux-arm64` |
            | Linux x86_64 (K8s) | `infrafence-agent-linux-amd64-k8s` |
            | Linux ARM64 (K8s)  | `infrafence-agent-linux-arm64-k8s` |

          files: |
            build/infrafence-agent-linux-amd64
            build/infrafence-agent-linux-amd64.sha256
            build/infrafence-agent-linux-amd64.sig
            build/infrafence-agent-linux-arm64
            build/infrafence-agent-linux-arm64.sha256
            build/infrafence-agent-linux-arm64.sig
            build/infrafence-agent-linux-amd64-k8s
            build/infrafence-agent-linux-amd64-k8s.sha256
            build/infrafence-agent-linux-amd64-k8s.sig
            build/infrafence-agent-linux-arm64-k8s
            build/infrafence-agent-linux-arm64-k8s.sha256
            build/infrafence-agent-linux-arm64-k8s.sig
            build/checksums.txt
            build/checksums.txt.sig
            install.sh

  docker:
    name: Docker Image
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set up QEMU (multi-arch)
        uses: docker/setup-qemu-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: infrafence
          password: ${{ secrets.DOCKERHUB_TOKEN }}
        continue-on-error: true

      - name: Build and push
        id: docker-build
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: |
            VERSION=${{ steps.version.outputs.VERSION }}
            BUILD_TAGS=kubernetes
          tags: |
            ghcr.io/infrafence/infrafence-agent:latest
            ghcr.io/infrafence/infrafence-agent:${{ steps.version.outputs.VERSION }}
            infrafence/infrafence-agent:latest
            infrafence/infrafence-agent:${{ steps.version.outputs.VERSION }}
          labels: |
            org.opencontainers.image.title=InfraFence Agent
            org.opencontainers.image.description=Real-time attack detection and blocking for Linux servers
            org.opencontainers.image.vendor=InfraFence
            org.opencontainers.image.source=https://github.com/infrafence/infrafence-agent
            org.opencontainers.image.version=${{ steps.version.outputs.VERSION }}

      - name: Attest Docker image provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ghcr.io/infrafence/infrafence-agent
          subject-digest: ${{ steps.docker-build.outputs.digest }}
          push-to-registry: true

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign Docker image
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          cosign sign --key env://COSIGN_PRIVATE_KEY \
            --yes \
            ghcr.io/infrafence/infrafence-agent@${{ steps.docker-build.outputs.digest }}

  helm:
    name: Helm Chart
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Update Chart version and appVersion
        run: |
          # `version` was never bumped here before — every release re-pushed the
          # same OCI tag (chart version is the OCI tag for Helm charts) with
          # different content underneath, which is exactly what a chart
          # repository's version-immutability assumption forbids. Artifact
          # Hub's tracker saw "already indexed this version" every time and
          # never picked up anything new (confirmed: last_tracking_ts stuck
          # days behind while last_scanning_ts kept advancing normally).
          # Chart version now simply tracks the agent's own version.
          sed -i "s/^version:.*/version: ${{ steps.version.outputs.VERSION }}/" charts/infrafence-agent/Chart.yaml
          sed -i "s/^appVersion:.*/appVersion: \"${{ steps.version.outputs.VERSION }}\"/" charts/infrafence-agent/Chart.yaml

      - name: Login to GHCR (Helm)
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Login to GHCR (Docker/Cosign)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Import GPG key
        run: |
          echo "${{ secrets.GPG_PRIVATE_KEY }}" | gpg --batch --import
          gpg --export-secret-keys > /tmp/secring.gpg

      - name: Package chart (signed)
        run: |
          helm package charts/infrafence-agent \
            --sign --key "InfraFence" --keyring /tmp/secring.gpg \
            -d /tmp/charts

      - name: Push chart with provenance to GHCR
        run: |
          CHART_VERSION=$(grep '^version:' charts/infrafence-agent/Chart.yaml | awk '{print $2}')
          CHART_TGZ="/tmp/charts/infrafence-agent-${CHART_VERSION}.tgz"

          # helm push already detects and attaches the co-located .tgz.prov
          # file (produced by `helm package --sign` above) as a layer on its
          # own — do not also upload it separately and append it to the
          # manifest by hand, that produces a manifest with the provenance
          # layer listed twice (verified: this is what was happening).
          helm push "${CHART_TGZ}" oci://ghcr.io/infrafence/charts
