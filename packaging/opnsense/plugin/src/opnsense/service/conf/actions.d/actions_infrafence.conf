[start]
command:/usr/local/etc/rc.d/infrafence start
parameters:
type:script
message:starting InfraFence agent

[stop]
command:/usr/local/etc/rc.d/infrafence stop
parameters:
type:script
message:stopping InfraFence agent

[restart]
command:/usr/local/etc/rc.d/infrafence restart
parameters:
type:script
message:restarting InfraFence agent

[status]
command:/usr/local/sbin/infrafence-agent appliance status
parameters:
type:script_output
message:InfraFence agent status

# The install token never goes through configd parameters (they can be
# logged) or argv: register.php reads it from a root-only spool file.
[register]
command:/usr/local/opnsense/scripts/OPNsense/InfraFence/register.php
parameters:
type:script_output
message:registering InfraFence agent

[mode]
command:/usr/local/sbin/infrafence-agent appliance mode
parameters:%s --actor %s
type:script_output
message:requesting InfraFence mode %s by %s

[bans]
command:/usr/local/sbin/infrafence-agent appliance bans
parameters:
type:script_output
message:listing InfraFence bans

[log]
command:/usr/local/opnsense/scripts/OPNsense/InfraFence/log.sh
parameters:
type:script_output
message:InfraFence log
