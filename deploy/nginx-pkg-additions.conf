    # ---- InfraFence package feeds (deploy/pkg-publish.sh) -------------------
    # Add inside the server block of /srv/infrafence-pkg-conf/default.conf,
    # AFTER the dotfile rule (location ~ /\. ...) and before "location /":
    # nginx tries regex locations in file order, and the dotfile rule must win
    # for /.releases/... and the publisher's temporary .<product>.new links.
    if ($request_method !~ ^(GET|HEAD)$) { return 405; }

    # Indexes and signatures change with every release: always revalidate.
    location ~ /(Packages|Packages\.gz|Packages\.sig|packages\.adb|meta\.conf|meta\.pkg|meta\.txz|packagesite\.[a-z]+|data\.[a-z]+|digests\.[a-z]+|filesite\.[a-z]+)$ {
        types { }
        default_type application/octet-stream;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }
    # Packages never change under the same name.
    location ~ \.(ipk|apk|pkg)$ {
        types { }
        default_type application/octet-stream;
        add_header Cache-Control "public, max-age=86400" always;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }
    # Installers and public keys: plain text, always revalidated.
    location ~ \.(sh|pub|pem)$ {
        types { }
        default_type text/plain;
        charset utf-8;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }
    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }
    # ---- end InfraFence package feeds ----------------------------------------
